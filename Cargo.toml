[package]
name = "cpr-vertex-ai-adapter"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "021134e4681424edf9882abaca83fb9830d1199f", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.19.0", features = ["v4"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
